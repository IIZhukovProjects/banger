post:
  operationId: createImageJob
  tags: [image_jobs]
  parameters:
    - in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-zA-Z0-9._:-]+$'}
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [prompt]
          properties:
            prompt: {type: string, minLength: 1, maxLength: 2000}
  responses:
    '202':
      description: Задание сохранено или найдено по ключу, включая уже завершенное
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [id, status, createdAt, updatedAt]
            properties:
              id: {type: string, format: uuid}
              status:
                type: string
                enum: [queued, running, succeeded, failed, needs_reconciliation]
              createdAt: {type: string, format: date-time}
              updatedAt: {type: string, format: date-time}
              result:
                type: object
                additionalProperties: false
                required: [resource, objectKey, mediaType, bytes, sha256, width, height]
                properties:
                  resource: {const: s3}
                  objectKey: {type: string, pattern: '^generated/[0-9a-f-]{36}\.png$'}
                  mediaType: {const: image/png}
                  bytes: {type: integer, minimum: 1, maximum: 10485760}
                  sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                  width: {type: integer, minimum: 1, maximum: 5000}
                  height: {type: integer, minimum: 1, maximum: 5000}
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum:
                      - moderated
                      - provider_auth
                      - provider_balance
                      - provider_failed
                      - invalid_image
                      - submit_unknown
                      - retry_exhausted
                  message: {type: string, minLength: 1, maxLength: 500}
            allOf:
              - if:
                  properties:
                    status: {const: succeeded}
                  required: [status]
                then:
                  required: [result]
                  not:
                    required: [error]
                else:
                  not:
                    required: [result]
              - if:
                  properties:
                    status:
                      enum: [failed, needs_reconciliation]
                  required: [status]
                then:
                  required: [error]
                else:
                  not:
                    required: [error]
    '409':
      description: Безопасная структурированная ошибка без секретов и provider payload
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message, retryable]
            properties:
              code:
                type: string
                enum: [invalid_request, idempotency_conflict, not_found, rate_limited, unavailable]
              message: {type: string, minLength: 1, maxLength: 500}
              retryable: {type: boolean}
    '422':
      description: Безопасная структурированная ошибка без секретов и provider payload
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message, retryable]
            properties:
              code:
                type: string
                enum: [invalid_request, idempotency_conflict, not_found, rate_limited, unavailable]
              message: {type: string, minLength: 1, maxLength: 500}
              retryable: {type: boolean}
    '429':
      description: Безопасная структурированная ошибка без секретов и provider payload
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message, retryable]
            properties:
              code:
                type: string
                enum: [invalid_request, idempotency_conflict, not_found, rate_limited, unavailable]
              message: {type: string, minLength: 1, maxLength: 500}
              retryable: {type: boolean}
    '503':
      description: Безопасная структурированная ошибка без секретов и provider payload
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message, retryable]
            properties:
              code:
                type: string
                enum: [invalid_request, idempotency_conflict, not_found, rate_limited, unavailable]
              message: {type: string, minLength: 1, maxLength: 500}
              retryable: {type: boolean}
