            "type": "string"
          },
          "kind": {
            "type": "string"
          },
          "message_id": {
            "type": "string"
          },
          "result": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/MediaJobResult"
              },
              {
                "type": "null"
              }
            ]
          },
          "status": {
            "enum": [
              "queued",
              "running",
              "succeeded",
              "failed",
              "interrupted"
            ]
          }
        },
        "required": [
          "id",
          "kind",
          "chat_id",
          "message_id",
          "status",
          "result",
          "error",
          "created_at"
        ],
        "type": "object"
      },
      "MediaJobResult": {
        "properties": {
          "file_id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "text": {
            "type": "string"
          },
          "type": {
            "type": "string"
          }
        },
        "type": "object"
      }
    }
  },
