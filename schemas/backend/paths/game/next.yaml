post:
  operationId: nextRound
  tags: [game]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            round_id: {type: string}
            force: {type: boolean, default: false}
          required: [round_id]
          additionalProperties: false
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: {const: true}
            required: [ok]
            additionalProperties: false
parameters:
  - name: X-Room-Code
    in: header
    required: false
    schema: {type: string}
  - name: Authorization
    in: header
    required: false
    schema: {type: string}
