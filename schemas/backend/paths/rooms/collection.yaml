get:
  operationId: listRooms
  tags: [rooms]
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              rooms:
                type: array
                items:
                  type: object
                  properties:
                    code: {type: string}
                    name: {type: string}
                    phase: {type: string}
                    players: {type: integer, minimum: 0}
                    capacity:
                      type: [integer, 'null']
                      minimum: 2
                    mode: {type: string}
                    count: {type: integer}
                  required: [code, name, phase, players, capacity, mode, count]
                  additionalProperties: false
            required: [rooms]
            additionalProperties: false
post:
  operationId: createRoom
  tags: [rooms]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name: {type: string, default: Наша компания, minLength: 1, maxLength: 40}
            capacity:
              type: [integer, 'null']
              minimum: 2
              default: 6
            count: {type: integer, default: 3, minimum: 1, maximum: 12}
            mode: {type: string, default: mix}
          required: []
          additionalProperties: false
  responses:
    '201':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              code: {type: string}
              name: {type: string}
              phase: {type: string}
              players: {type: integer, minimum: 0}
              capacity:
                type: [integer, 'null']
                minimum: 2
              mode: {type: string}
              count: {type: integer}
            required: [code, name, phase, players, capacity, mode, count]
            additionalProperties: false
