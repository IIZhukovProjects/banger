post:
  operationId: joinRoom
  tags: [rooms]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name: {type: string, minLength: 1, maxLength: 20}
          required: [name]
          additionalProperties: false
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              token: {type: string}
              room_code: {type: string}
            required: [token, room_code]
            additionalProperties: false
parameters:
  - name: X-Room-Code
    in: header
    required: false
    schema: {type: string}
  - name: Authorization
    in: header
    required: false
    schema: {type: string}
