apiVersion: platform.iizhukov.dev/v1alpha1
kind: Environment
environment:
  name: local
  runtime: local
  resourceProvider: docker
  environment:
    PYTHONUNBUFFERED: '1'
    TZ: UTC
  services:
    backend:
      environment:
        MAX_UPLOAD_BYTES: '10485760'
    llm:
      environment:
        IMAGE_PROVIDER: fake
        IMAGE_JOB_CONCURRENCY: '2'
