apiVersion: platform.iizhukov.dev/v1alpha1
kind: Environment
environment:
  name: prod
  runtime: platform
  resourceProvider: platform
  environment:
    PYTHONUNBUFFERED: '1'
    TZ: UTC
  services:
    backend:
      environment:
        MAX_UPLOAD_BYTES: '10485760'
        AI_GATEWAY_URL:
          secretRef:
            id: null
        AI_GATEWAY_TOKEN:
          secretRef:
            id: null
