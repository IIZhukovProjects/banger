apiVersion: platform.iizhukov.dev/v1alpha1
kind: Environment
environment:
  name: prod
  runtime: platform
  resourceProvider: platform
  environment:
    PYTHONUNBUFFERED: '1'
    TZ: UTC
  services:
    backend:
      environment:
        MAX_UPLOAD_BYTES: '10485760'
    llm:
      environment:
        IMAGE_PROVIDER: polza
        IMAGE_JOB_CONCURRENCY: '2'
        POLZA_API_KEY:
          secretRef:
            id: sec_20fb3db0bde3434da568a441e434ac4c
