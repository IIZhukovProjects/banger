apiVersion: platform.iizhukov.dev/v1alpha1
kind: Deployment
deployment:
  environments:
    prod:
      enabled: true
      strategy: rolling
      defaults:
        instances: 4
        placement:
          machines: 2
          datacenters: 2
        resources:
          cpuCores: 0.1
          memoryMiB: 128
          diskMiB: 512
      workloads:
        frontend:
          resources:
            cpuCores: 0.05
            memoryMiB: 32
            diskMiB: 128
        llm:
          instances: 2
          resources:
            cpuCores: 0.15
            memoryMiB: 192
            diskMiB: 512
