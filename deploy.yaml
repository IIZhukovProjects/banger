apiVersion: platform.iizhukov.dev/v1alpha1
kind: Deployment
deployment:
  environments:
    test:
      enabled: false
      strategy: rolling
      defaults:
        instances: 1
        placement:
          machines: 1
          datacenters: 1
        resources:
          cpuCores: 0.5
          memoryMiB: 512
          diskMiB: 1024
      workloads:
        frontend:
          resources:
            cpuCores: 0.25
            memoryMiB: 128
            diskMiB: 256
    prod:
      enabled: false
      strategy: rolling
      defaults:
        instances: 2
        placement:
          machines: 2
          datacenters: 2
        resources:
          cpuCores: 0.5
          memoryMiB: 512
          diskMiB: 1024
      workloads:
        frontend:
          resources:
            cpuCores: 0.25
            memoryMiB: 128
            diskMiB: 256
        llm:
          instances: 1
          placement:
            machines: 1
            datacenters: 1
