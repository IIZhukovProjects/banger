apiVersion: platform.iizhukov.dev/v1alpha1
kind: Deployment
deployment:
  environments:
    test:
      enabled: true
      strategy: rolling
      defaults:
        instances: 4
        placement:
          machines: 2
          datacenters: 2
      workloads:
        llm:
          instances: 2
          placement:
            machines: 2
            datacenters: 2
        frontend:
          instances: 2
          placement:
            machines: 2
            datacenters: 2
    prod:
      enabled: false
      strategy: rolling
      defaults:
        instances: 2
        placement:
          machines: 2
          datacenters: 2
      workloads:
        llm:
          instances: 1
          placement:
            machines: 1
            datacenters: 1
