apiVersion: platform.iizhukov.dev/v1alpha1
kind: Service
service:
  clients:
  - llm
  name: backend
  version: 0.1.0
  description: Комнаты, игроки, игровые переходы, таймеры, голосование и счет
  active: true
  python:
    major: 3
    minor: 12
  main:
    enabled: true
  server:
    http:
      enabled: true
      port: 8000
      schema: schemas/backend/api.yaml
    grpc:
      enabled: false
      port: 8080
      schema:
  resources:
    postgres:
      resource: postgres
      database: game
      access: read-write
      migrations:
        directory: migrations
    s3:
      resource: s3
      access: read-write
    observability:
      logs: true
      metrics: true
      traces: true
      logging:
        local:
          enabled: true
          path: logs/backend.log
          level: INFO
        platform:
          level: INFO
  initialize:
    command: [python, -m, seed_catalog]
    environment: [DATABASE_URL]
  scheduler:
    enabled: false
    storage: memory
